name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: mcp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-dev --prefer-dist --optimize-autoloader
      - name: PHP syntax
        run: find . -path './.git' -prune -o -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/contract.php
      - run: php tests/regression.php
      - run: php tests/security-regression.php
      - run: php tests/security-storage.php
        env:
          MCP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mcp_test;charset=utf8mb4
          MCP_TEST_USER: root
          MCP_TEST_PASSWORD: test-only-password
